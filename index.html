<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="app.js" defer></script>
    <title>Tic Tac Toe game</title>
</head>
<body class="relative">

    <!--credit-->
    <a href="https://github.com/Abdelmalekdev"><img id="credit" src="icons/abdelmalek.svg" class=" absolute w-10 rounded-full left-4 top-4 ring-4 transition-all duration-200 hover:ring-6"><p id="credit-text" class="absolute left-20 top-5 font-semibold md:opacity-0 transition-all duration-300">Made by AbdelMalek Dev</p></a>

    <div class=" w-screen min-h-screen flex flex-col justify-center items-center gap-3">

        <!--who will play indicator-->
        <div id="turn-indicator" class="flex justify-center items-center h-5">
            <img src="icons/X.svg" class="w-[5%]">
        </div>
        
        <!--the calls-->
        <div class="flex flex-col gap-3">
            
            <div id="game-container" class="grid grid-cols-3 gap-0">
                <div class="xo-area border-r-5 border-b-5 p-5 max-sm:p-3"></div>
                <div class="xo-area border-x-5 border-b-5 p-5 max-sm:p-3"></div>
                <div class="xo-area border-l-5 border-b-5 p-5 max-sm:p-3"></div>
                <div class="xo-area border-y-5 border-r-5 p-5 max-sm:p-3"></div>
                <div class="xo-area border-5 p-5 max-sm:p-3"></div>
                <div class="xo-area border-y-5 border-l-5 p-5 max-sm:p-3"></div>
                <div class="xo-area border-t-5 border-r-5 p-5 max-sm:p-3"></div>
                <div class="xo-area border-x-5 border-t-5 p-5 max-sm:p-3"></div>
                <div class="xo-area border-t-5 border-l-5 p-5 max-sm:p-3"></div>
            </div>

        </div>

        <!--score UI-->
        <div class="flex flex-col justify-center items-center gap-3">
                <div id="statistics-container" class="grid grid-cols-3 gap-10">
                    <div class="flex flex-col justify-center items-center">
                        <h3 class="font-semibold text-2xl max-sm:text-sm">PLAYER X</h3>
                        <p id="player-x-score" class="font-medium text-4xl max-sm:text-2xl">0</p>
                    </div>
                    <div class="flex flex-col justify-center items-center">
                        <h3 class="font-semibold text-2xl max-sm:text-sm">DRAW</h3>
                        <p id="draw-score" class="font-medium text-4xl max-sm:text-2xl">0</p>
                    </div>
                    <div class="flex flex-col justify-center items-center">
                        <h3 class="font-semibold text-2xl max-sm:text-sm">PLAYER O</h3>
                        <p id="player-o-score" class="font-medium text-4xl max-sm:text-2xl">0</p>
                    </div>
                </div>
                    <!--restart button-->
                    <button id="restart-btn" class="font-medium bg-blue-500 px-8 py-2 text-4xl text-white rounded-xl shadow-xl transition-all duration-200 hover:px-12 hover:tracking-widest active:bg-blue-900">RESTART</button>
            </div>
    </div>

</body>
</html>
