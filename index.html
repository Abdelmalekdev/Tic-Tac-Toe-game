<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="app.js" defer></script>
    <title>Tic Tac Toe game</title>
</head>
<body>

    <div class=" bg-slate-800 w-screen min-h-screen flex justify-center items-center">
        <div class="flex flex-col gap-3">
            <div id="turn-indicator" class="flex justify-center items-center">
                <i class="fa-solid fa-x text-4xl"></i>
            </div>
            <div id="game-container" class="grid grid-cols-3">
                <div class="xo-area"></div>
                <div class="xo-area"></div>
                <div class="xo-area"></div>
                <div class="xo-area"></div>
                <div class="xo-area"></div>
                <div class="xo-area"></div>
                <div class="xo-area"></div>
                <div class="xo-area"></div>
                <div class="xo-area"></div>

            </div>
            <div class="flex flex-col justify-center items-center gap-3">
                <div id="statistics-container" class="grid grid-cols-3 gap-20">
                    <div class="flex flex-col justify-center items-center">
                        <h3 class=" text-4xl">PX</h3>
                        <p id="player-x-score" class=" text-3xl">0</p>
                    </div>
                    <div class="flex flex-col justify-center items-center">
                        <h3 class=" text-4xl">Draw</h3>
                        <p id="draw-score" class=" text-3xl">0</p>
                    </div>
                    <div class="flex flex-col justify-center items-center">
                        <h3 class=" text-4xl">PO</h3>
                        <p id="player-o-score" class=" text-3xl">0</p>
                    </div>
                </div>
                    <button id="restart-btn" class="bg-blue-500 px-3 py-1 text-4xl rounded-xl">restar</button>
            </div>
        </div>
    </div>

</body>
</html>
